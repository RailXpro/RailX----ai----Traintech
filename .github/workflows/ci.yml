name: CI - Build and Typecheck

on:
  push:
    branches: [ "main", "master", "front-end" ]
  pull_request:
    branches: [ "main", "master", "front-end" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and Build
        run: npm run build
